# Board: M5Stack AtomS3 (M5Stack)
# Definition: definitions/boards/m5stack-atoms3/manifest.yaml

esphome:
  name: kitchen
  friendly_name: Kitchen

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    micro_wake_word: DEBUG
    i2s_audio.microphone: DEBUG

api:
  encryption:
    key: !secret kitchen_api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Kitchen Fallback Hotspot
    password: !secret kitchen_fallback_password

captive_portal:

# I2C Bus for the Codec
i2c:
  id: i2c_bus
  sda:
    number: GPIO45
    ignore_strapping_warning: true
  scl:
    number: GPIO0
    ignore_strapping_warning: true

# ES8311 Audio Codec
audio_dac:
  - platform: es8311
    id: codec
    i2c_id: i2c_bus
    mic_gain: 30DB
    bits_per_sample: 16bit
    sample_rate: 48000

# Hardware Speaker Amplifier Enable
switch:
  - platform: gpio
    name: "Speaker Amplifier"
    pin: GPIO18
    restore_mode: ALWAYS_ON
    entity_category: config

# I2S Audio Bus
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

# Microphone Setup
microphone:
  - platform: i2s_audio
    id: echo_mic
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin: GPIO4
    channel: left
    bits_per_sample: 16bit
    sample_rate: 16000

# 1. Raw Hardware Speaker
speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO48
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: codec

media_player:
  - platform: speaker
    name: "Kitchen Speaker"
    id: kitchen_speaker
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: echo_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
          - micro_wake_word.stop:
          - if:
              condition:
                - voice_assistant.is_running:
              then:
                - wait_until:
                    - not:
                        voice_assistant.is_running:
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running
          then:
            - micro_wake_word.start:

voice_assistant:
  id: va
  microphone: echo_mic
  media_player: kitchen_speaker
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 6.0
  use_wake_word: false
  on_client_connected:
    - logger.log: "Assist client connected; starting wake-word detection"
    - micro_wake_word.start:
  on_client_disconnected:
    - logger.log: "Assist client disconnected"
    - micro_wake_word.stop:
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - micro_wake_word.start:
  on_error:
    - logger.log:
        format: "Assist error [%s]: %s"
        args: [code.c_str(), message.c_str()]

micro_wake_word:
  id: mww
  microphone: echo_mic
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - logger.log: "Hey Jarvis wake word detected"
    - voice_assistant.start:
        wake_word: !lambda return wake_word;